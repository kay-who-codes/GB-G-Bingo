<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB&amp;G Bingo</title>
<style>
  :root { --bg:#0d0b1f; --tile:#1a1535; --tile-hi:#2a2250; --cyan:#00e5ff; --pink:#ff2e9a; --text:#f4f0ff; }
  * { box-sizing: border-box; }
  html { background:var(--bg); color-scheme:dark; }
  html, body { margin:0; min-height:100%; color:var(--text); font-family: system-ui, "gg sans", sans-serif; }
  body { min-height:100vh; min-height:100dvh; background:var(--bg); }
  #app { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:10px 10px 14px; }
  h1 { margin:0; padding:4px 18px; letter-spacing:.3em; font-size:clamp(22px,4.5vw,38px); font-weight:900; color:#fff;
    background:rgba(13,11,31,.75); border:2px solid var(--cyan); border-radius:12px;
    text-shadow:0 0 6px var(--cyan), 0 0 16px var(--pink); box-shadow:0 0 14px rgba(0,229,255,.55), 0 0 28px rgba(255,46,154,.3); }
  #banner { min-height:1.4em; line-height:1.4em; font-weight:800; font-size:clamp(16px,3vw,26px); color:var(--pink); text-shadow:0 0 12px var(--pink); }
  #board { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); grid-template-rows:repeat(5,minmax(0,1fr)); gap:6px; width:min(94vw,calc(100vh - 200px),720px); aspect-ratio:1; }
  .cell { position:relative; display:flex; align-items:center; justify-content:center; text-align:center; padding:4px;
    background:var(--tile); border:2px solid rgba(0,229,255,.25); border-radius:10px; cursor:pointer; user-select:none;
    font-size:clamp(9px,1.9vw,17px); font-weight:600; line-height:1.15; overflow:hidden; transition:transform .12s, background .2s, box-shadow .2s; }
  .cell:hover { background:var(--tile-hi); transform:scale(1.03); border-color:var(--cyan); }
  .cell.on { background:linear-gradient(135deg,#00b8d4,var(--cyan)); color:#04121a; border-color:#fff; box-shadow:0 0 14px rgba(0,229,255,.7); animation:pop .25s; }
  .cell.win { background:linear-gradient(135deg,#d6006f,var(--pink)); color:#fff; border-color:#fff; box-shadow:0 0 18px rgba(255,46,154,.9); animation:pulse 1s infinite; }
  .cell { flex-direction:column; gap:2px; }
  .cell small { font-size:.72em; font-weight:500; opacity:.8; }
  .cell img { position:absolute; inset:4px; width:calc(100% - 8px); height:calc(100% - 8px); object-fit:contain; opacity:.55; transition:opacity .2s; }
  .cell.on img, .cell.win img { opacity:1; }
  .cell.center { border-color:var(--pink); }
  .ctl { background:#0d0b1f; color:#fff; border:2px solid var(--pink); border-radius:10px; padding:9px 22px; font-size:15px; font-weight:800;
    letter-spacing:.05em; cursor:pointer; box-shadow:0 0 12px rgba(255,46,154,.55); text-shadow:0 0 6px var(--pink); font-family:inherit; }
  .ctl:hover, .ctl.confirm { background:var(--pink); box-shadow:0 0 20px var(--pink); }
  #controls { display:flex; align-items:center; gap:10px; }
  #count { font-weight:700; opacity:.85; min-width:5.5em; text-align:center; text-shadow:0 0 8px var(--cyan); }
  .cell { font-family:inherit; color:var(--text); min-width:0; min-height:0; aspect-ratio:1; overflow:hidden; overflow-wrap:anywhere; }
  .cell.long { font-size:clamp(8px,1.5vw,14px); } .cell.xlong { font-size:clamp(7px,1.25vw,12px); }
  .cell:focus-visible, .ctl:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:9; }
  .confetti i { position:absolute; top:-20px; width:8px; height:14px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  .cell.near { border-color:var(--pink); box-shadow:0 0 10px rgba(255,46,154,.6), inset 0 0 8px rgba(255,46,154,.35); animation:near 1.6s ease-in-out infinite; }
  @keyframes near { 50% { box-shadow:0 0 24px var(--c), inset 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); } }
  details#authors { position:relative; }
  details#authors summary { list-style:none; } details#authors summary::-webkit-details-marker { display:none; }
  #authorList { position:absolute; bottom:120%; right:0; z-index:5; min-width:210px; max-height:40vh; overflow:auto; padding:10px 12px;
    background:#0d0b1f; border:2px solid var(--cyan); border-radius:10px; box-shadow:0 0 16px rgba(0,229,255,.5); }
  #authorList label { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:14px; cursor:pointer; white-space:nowrap; }
  #authorList small { opacity:.7; margin-left:auto; padding-left:12px; }
  #authorList .note { font-size:12px; opacity:.7; padding:4px 0 2px; white-space:normal; }
  @keyframes pop { 50% { transform:scale(1.12); } }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  /* ---- author colours: --c is set per tile ---- */
  .cell { background:color-mix(in srgb, var(--c, #8a8fa8) calc(var(--tint, 22) * 1%), var(--tile)); border-color:color-mix(in srgb, var(--c, #8a8fa8) 70%, transparent); }
  .cell:hover { background:color-mix(in srgb, var(--c, #8a8fa8) calc((var(--tint, 22) + 12) * 1%), var(--tile)); border-color:var(--c); }
  .cell.on { background:color-mix(in srgb, var(--c) calc(var(--fill, 100) * 1%), var(--tile)); color:#0d0b1f; border-color:#fff; box-shadow:0 0 14px var(--c); }
  .cell.win { background:var(--c); color:#0d0b1f; border-color:#fff; box-shadow:0 0 22px #fff, 0 0 12px var(--c); }
  .cell.near { border-color:var(--c); box-shadow:0 0 12px var(--c), inset 0 0 8px color-mix(in srgb, var(--c) 45%, transparent); }
  .sw { width:12px; height:12px; border-radius:50%; flex:none; box-shadow:0 0 6px currentColor; }
</style>
</head>
<body>
  <div id="app">
    <h1 id="title"></h1>
    <div id="banner"></div>
    <div id="board"></div>
    <div id="controls">
      <button class="ctl" id="reset">New card</button>
      <span id="count"></span>
      <details id="authors" hidden><summary class="ctl">Authors</summary><div id="authorList"></div></details>
      <button class="ctl" id="mute" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="confetti" id="confetti"></div>
  </div>
  <script type="module">
import * as cfg from "./phrases.js";
const { PHRASES, TITLE, SOUNDS } = cfg;
const SHOW_AUTHORS = cfg.SHOW_AUTHORS !== false;
const VOLUME = cfg.VOLUME ?? 0.7;
const SHOW_HINTS = cfg.SHOW_HINTS !== false;
document.documentElement.style.setProperty("--tint", cfg.TILE_TINT ?? 22);
document.documentElement.style.setProperty("--fill", cfg.UNLOCKED_FILL ?? 100);
const CLIENT_ID = cfg.CLIENT_ID; // may be undefined if phrases.js is an older copy

const N = 5, CENTER = 12, KEY = "discord-bingo-v2";
const idx = (r, c) => r * N + c;

// ---------- Discord (optional: also runs fine in a normal browser for testing) ----------
(async () => {
  try {
    // Loaded through the /npm URL mapping set up in the Discord Developer Portal.
    const { DiscordSDK } = await import("/npm/@discord/embedded-app-sdk@1.5.0/+esm");
    if (!CLIENT_ID || CLIENT_ID.startsWith("PASTE")) throw new Error("CLIENT_ID missing in phrases.js");
    await new DiscordSDK(CLIENT_ID).ready();
  } catch (e) { console.warn("Discord SDK not started:", e.message); }
})();

// ---------- Sound ----------
const SOUND_FILES = { press: "./sounds/button_press.mp3", win: "./sounds/bingo!.mp3", ...(cfg.SOUNDS || {}) };
const audio = {};
for (const [k, src] of Object.entries(SOUND_FILES)) { try { const a = new Audio(encodeURI(src)); a.preload = "auto"; audio[k] = a; } catch {} }
let muted = false;
try { muted = localStorage.getItem("discord-bingo-muted") === "1"; } catch {}
function play(name) {
  const base = audio[name];
  if (muted || !base) return;
  try { const a = base.cloneNode(); a.volume = VOLUME; a.play().catch(() => {}); } catch {}
}
function confetti() {
  const box = document.getElementById("confetti"), colors = ["#00e5ff", "#ff2e9a", "#ffffff"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.cssText = `left:${Math.random() * 100}%;background:${colors[i % 3]};animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * .6}s`;
    box.appendChild(p);
  }
  setTimeout(() => (box.innerHTML = ""), 4800);
}

// ---------- Winning lines ----------
// Contiguous runs of 4: rows, columns, diagonals (incl. the length-4 ones), and 2x2 boxes.
const LINES = [];
for (let a = 0; a < N; a++) for (let s = 0; s <= 1; s++) {
  LINES.push([0, 1, 2, 3].map(i => idx(a, s + i)));      // horizontal
  LINES.push([0, 1, 2, 3].map(i => idx(s + i, a)));      // vertical
}
for (let r0 = 0; r0 <= 1; r0++) for (let c0 = 0; c0 <= 1; c0++) {
  LINES.push([0, 1, 2, 3].map(i => idx(r0 + i, c0 + i)));        // diagonal \
  LINES.push([0, 1, 2, 3].map(i => idx(r0 + i, N - 1 - c0 - i))); // diagonal /
}
for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++)
  LINES.push([idx(r, c), idx(r, c + 1), idx(r + 1, c), idx(r + 1, c + 1)]); // 2x2 box
// Gap-bridging: in EVERY row and column, 2 unlocked on each side of the middle cell wins
// (the middle cell may be locked). Same for both main diagonals through the center tile.
for (let a = 0; a < N; a++) {
  LINES.push([0, 1, 3, 4].map(i => idx(a, i)));  // row a, split across the middle column
  LINES.push([0, 1, 3, 4].map(i => idx(i, a)));  // column a, split across the middle row
}
LINES.push([0, 1, 3, 4].map(i => idx(i, i)));          // diagonal \ bridging the center
LINES.push([0, 1, 3, 4].map(i => idx(i, N - 1 - i)));  // diagonal / bridging the center

// ---------- State ----------
// Accepts "text", ["text", "author", weight], or { text, author, weight }.
const ALL = PHRASES.map(p => Array.isArray(p) ? { text: p[0], author: p[1], weight: p[2] }
  : typeof p === "string" ? { text: p } : p)
  .map(p => ({ text: String(p.text), author: p.author || "", weight: Number(p.weight ?? 1) }))
  .filter(p => p.text && p.weight > 0);

// Authors switched off by the developer (DISABLED_AUTHORS) never appear; players can switch off others in the Authors panel.
const DEV_OFF = new Set((cfg.DISABLED_AUTHORS || []).map(a => a.toLowerCase()));
const ENABLED = ALL.filter(p => !DEV_OFF.has(p.author.toLowerCase()));
const AUTHORS = [...new Set(ENABLED.map(p => p.author).filter(Boolean))].sort((a, b) => a.localeCompare(b));
const CFG_COLORS = Object.fromEntries(Object.entries(cfg.AUTHOR_COLORS || {}).map(([k, v]) => [k.toLowerCase(), v]));
const autoColors = {}; let ai = 0; // authors without a configured colour get a distinct generated one
AUTHORS.forEach(a => { if (!CFG_COLORS[a.toLowerCase()]) autoColors[a] = `hsl(${Math.round((ai++ * 137.5 + 300) % 360)} 85% 62%)`; });
const colorFor = a => (a && (CFG_COLORS[a.toLowerCase()] || autoColors[a])) || "#8a8fa8";
const OFF_KEY = "discord-bingo-off-authors";
let off = new Set(); try { off = new Set(JSON.parse(localStorage.getItem(OFF_KEY) || "[]")); } catch {}
const poolWithout = set => ENABLED.filter(p => !set.has(p.author));
const activePool = () => { const p = poolWithout(off); return p.length >= 24 ? p : ENABLED; };

// Weighted random sample WITHOUT replacement (Efraimidis-Spirakis): higher weight = shows up more often.
function pick(n) {
  return activePool().map(p => ({ p, k: Math.pow(Math.random(), 1 / p.weight) }))
    .sort((x, y) => y.k - x.k).slice(0, n).map(x => x.p)
    .sort(() => Math.random() - 0.5); // shuffle placement on the card
}
function newState() {
  const p = pick(24).map(({ text, author }) => ({ text, author }));
  const cells = Array.from({ length: 25 }, (_, i) => (i === CENTER ? null : p[i < CENTER ? i : i - 1] || { text: "", author: "" }));
  return { cells, on: [], won: false };
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!state || state.cells?.length !== 25) state = newState();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

// ---------- Render ----------
const board = document.getElementById("board");
const banner = document.getElementById("banner");
document.getElementById("title").textContent = TITLE; document.title = TITLE;

function winningCells() {
  const on = new Set(state.on), out = new Set();
  for (const line of LINES) if (line.every(i => on.has(i))) line.forEach(i => out.add(i));
  return out;
}

// Center image: tries Image.PNG first, then other letter-casings (hosts like GitHub Pages are case-sensitive).
const IMG_TRIES = ["./Image.PNG", "./Image.png", "./image.png", "./image.PNG"];
let centerSrc = IMG_TRIES[0], centerTry = 0;
function centerEl() {
  if (!centerSrc) { const s = document.createElement("span"); s.textContent = "★"; return s; }
  const img = new Image(); img.alt = "Center";
  img.onerror = () => { centerSrc = IMG_TRIES[++centerTry] || null; render(); };
  img.src = centerSrc;
  return img;
}

function render() {
  const on = new Set(state.on), win = winningCells();
  const near = new Set();
  if (SHOW_HINTS) for (const line of LINES) { const miss = line.filter(i => !on.has(i)); if (miss.length === 1) near.add(miss[0]); }
  board.innerHTML = "";
  state.cells.forEach((text, i) => {
    const el = document.createElement("button");
    el.type = "button"; el.setAttribute("aria-pressed", on.has(i));
    el.className = "cell" + (i === CENTER ? " center" : "") + (on.has(i) ? " on" : "") + (win.has(i) ? " win" : "") + (near.has(i) && !on.has(i) ? " near" : "");
    if (i === CENTER) { el.appendChild(centerEl()); el.style.setProperty("--c", "#b794ff"); }
    else {
      el.style.setProperty("--c", colorFor(text.author));
      const t = document.createElement("span"); t.textContent = text.text; el.appendChild(t);
      if (text.text.length > 70) el.classList.add("xlong"); else if (text.text.length > 40) el.classList.add("long");
      if (SHOW_AUTHORS && text.author) { const s = document.createElement("small"); s.textContent = "— " + text.author; el.appendChild(s); }
    }
    el.onclick = () => toggle(i);
    board.appendChild(el);
  });
  banner.textContent = win.size ? "🎉 BINGO! 🎉" : "";
  document.getElementById("count").textContent = on.size + " / 25";
  fitText();
}

function toggle(i) {
  const had = state.on.includes(i);
  state.on = had ? state.on.filter(x => x !== i) : [...state.on, i];
  const hasWin = winningCells().size > 0;
  play("press");
  if (hasWin && !state.won) { play("win"); confetti(); }
  state.won = hasWin;
  save(); render();
}

// "New card" asks for a second tap when the current card has progress, so it can't be hit by accident.
const resetBtn = document.getElementById("reset"); let resetTimer;
resetBtn.onclick = () => {
  play("press");
  if (state.on.length && !resetBtn.classList.contains("confirm")) {
    resetBtn.classList.add("confirm"); resetBtn.textContent = "Tap again";
    resetTimer = setTimeout(() => { resetBtn.classList.remove("confirm"); resetBtn.textContent = "New card"; }, 3000);
    return;
  }
  clearTimeout(resetTimer); resetBtn.classList.remove("confirm"); resetBtn.textContent = "New card";
  state = newState(); save(); render();
};

const muteBtn = document.getElementById("mute");
muteBtn.textContent = muted ? "🔇" : "🔊";
muteBtn.onclick = () => {
  muted = !muted; muteBtn.textContent = muted ? "🔇" : "🔊";
  try { localStorage.setItem("discord-bingo-muted", muted ? "1" : "0"); } catch {}
  play("press");
};

// Tiles are always square and never grow: shrink the text until it fits inside its tile.
function fitText() {
  board.querySelectorAll(".cell:not(.center)").forEach(el => {
    el.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && fs > 6) { fs -= 0.5; el.style.fontSize = fs + "px"; }
  });
}
new ResizeObserver(() => fitText()).observe(board);

// ---------- Authors panel ----------
const authorsBox = document.getElementById("authors"), list = document.getElementById("authorList");
if (AUTHORS.length) {
  authorsBox.hidden = false;
  const counts = {}; ENABLED.forEach(p => { counts[p.author] = (counts[p.author] || 0) + 1; });
  AUTHORS.forEach(a => {
    const label = document.createElement("label"), cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !off.has(a);
    cb.onchange = () => {
      const next = new Set(off); cb.checked ? next.delete(a) : next.add(a);
      if (poolWithout(next).length < 24) { cb.checked = !cb.checked; banner.textContent = "Need at least 24 phrases"; setTimeout(render, 1800); return; }
      off = next; play("press");
      try { localStorage.setItem(OFF_KEY, JSON.stringify([...off])); } catch {}
    };
    const name = document.createElement("span"); name.textContent = a;
    const sw = document.createElement("i"); sw.className = "sw"; sw.style.background = sw.style.color = colorFor(a);
    const n = document.createElement("small"); n.textContent = counts[a];
    label.append(cb, sw, name, n); list.appendChild(label);
  });
  const note = document.createElement("div"); note.className = "note"; note.textContent = "Applies to your next new card.";
  list.appendChild(note);
}
render();
</script>
</body>
</html>
